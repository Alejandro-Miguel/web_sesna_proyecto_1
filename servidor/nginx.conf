# Guías y documentos · configuración de referencia para Nginx
# Sirve la carpeta dist/ (generada con `node build.mjs`).
# Requiere HTTPS. Para brotli estático se necesita el módulo ngx_brotli;
# si no está, gzip_static basta.

server {
    listen 443 ssl;
    http2 on;
    server_name ejemplo.gob.mx;                 # ← dominio real
    root /var/www/guias/dist;
    index index.html;

    server_tokens off;                          # no revelar versión de Nginx

    # Compresión: usa los .br / .gz precomprimidos por build.mjs
    gzip_static on;
    # brotli_static on;                         # ← descomentar si ngx_brotli está instalado

    # ---- Cabeceras de seguridad (todas las respuestas) ----
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types app" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---- Caché ----
    # Archivos con hash en el nombre: un año, inmutables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # (add_header en un location reemplaza los heredados: se repiten los de seguridad)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }
    # HTML: siempre revalidar para recibir las nuevas rutas con hash.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types app" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # No servir archivos ocultos ni los precomprimidos de forma directa
    location ~ /\. { deny all; }

    # Solo métodos de lectura
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
}

# Redirección permanente de HTTP a HTTPS
server {
    listen 80;
    server_name ejemplo.gob.mx;
    return 301 https://$host$request_uri;
}
